server:
  port: ${PORT:8080}
  shutdown: graceful

spring:
  application:
    name: api-testing-playground
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:mem:testdb;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER:org.h2.Driver}
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: false
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method

playground:
  cors:
    allowed-origins: ${PLAYGROUND_CORS_ALLOWED_ORIGINS:http://localhost:[*],http://127.0.0.1:[*],http://localhost,https://localhost:[*]}
  security:
    allow-loopback: ${PLAYGROUND_ALLOW_LOOPBACK:true}
    allow-private-ips: ${PLAYGROUND_ALLOW_PRIVATE_IPS:true}
    max-redirects: 5
    connect-timeout-ms: 10000
    read-timeout-ms: 30000
    max-response-size-bytes: 5242880
