version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: playground-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${DB_NAME:-api_testing_playground}
      MYSQL_USER: ${DB_USER:-playground_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-playground_pass}
    ports:
      - "${DB_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD:-root}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - playground-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: playground-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-api_testing_playground}
      DB_USER: ${DB_USER:-playground_user}
      DB_PASSWORD: ${DB_PASSWORD:-playground_pass}
      PLAYGROUND_ALLOW_LOOPBACK: "true"
      PLAYGROUND_ALLOW_PRIVATE_IPS: "true"
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8080/api/v1/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - playground-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: playground-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:80"
    networks:
      - playground-network

volumes:
  mysql_data:

networks:
  playground-network:
    driver: bridge
